<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#071b27" />
    <title>فَطِن</title>
        <link rel="stylesheet" href="style.css?v=8" />
    <script>
      try {
        var t = localStorage.getItem("faten-theme");
        if (t && t !== "dark") {
          document.documentElement.setAttribute("data-theme", t);
        }
      } catch (_) {}
    </script>
  </head>
  <body>
        <div id="loader" class="loader" role="status" aria-label="جارٍ التحميل">
      <div class="loader-logo">فَـطِن</div>
      <div class="loader-dots" aria-hidden="true">
        <span></span><span></span><span></span>
      </div>
      <p class="loader-text">جارٍ التحميل...</p>
    </div>
        <main class="app-shell loading">
      <header class="topbar">
        <div class="brand">

          <div>
            <h1>
              <span class="faten-logo">فَـطِن</span>
            </h1>
          </div>
          <span id="stageBadge" class="stage-badge" aria-label="المرحلة">
            <b id="stageNum">١</b><i>/</i><span id="stageTotal">٣٠</span>
          </span>
        </div>
        <div class="top-actions">
          <span id="playerName" class="player-name"></span>
          <button
            id="boardBtn"
            class="icon-btn"
            type="button"
            aria-label="اللوحة الشرفية"
            title="اللوحة الشرفية"
          >
            🏆
          </button>
          <button
            id="soundToggle"
            class="icon-btn"
            type="button"
            aria-label="كتم الصوت"
            title="الصوت"
          >
            🔊
          </button>
                    <button
            id="themeToggle"
            class="icon-btn"
            type="button"
            aria-label="تبديل الوضع"
            title="تبديل الوضع"
          >
            ☀️
          </button>
        </div>
      </header>

      <section class="progress-panel">
        <div class="progress-track">
          <div id="progressBar" class="progress-bar"></div>
        </div>
      </section>

      <section class="questions-section">
        <div id="questionsGrid" class="questions-grid"></div>
      </section>

         <section class="play-panel">
        <div class="play-top">
          <button id="checkBtn" class="check-btn" type="button" disabled>
            افحص
          </button>
          <button id="nextInlineBtn" class="check-btn" type="button" hidden>
            التالي ←
          </button>

          <div
            id="answerSlots"
            class="answer-slots"
            aria-label="خانات الإجابة"
          ></div>

          <button
            id="hintBtn"
            class="hint-btn"
            type="button"
            aria-label="تلميح"
            title="تلميح"
          >
            <svg
              viewBox="0 0 24 24"
              width="26"
              height="26"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M9 18h6" />
              <path d="M10 21h4" />
              <path
                d="M12 3a6 6 0 0 0-3.6 10.8c.6.5 1.1 1.3 1.1 2.2h5c0-.9.5-1.7 1.1-2.2A6 6 0 0 0 12 3z"
              />
            </svg>
            <span id="hintCount" class="hint-count">٣</span>
          </button>
        </div>

        <div id="letterTiles" class="letter-tiles"></div>

        <div class="action-row">
          <span
            id="feedback"
            class="feedback"
            role="status"
            aria-live="polite"
          ></span>
        </div>
      </section>

    </main>

    <div
      id="stageModal"
      class="modal hidden"
      role="dialog"
      aria-modal="true"
      aria-labelledby="modalTitle"
    >
      <div class="modal-card">
        <div class="modal-symbol">✦</div>
        <p class="eyebrow">إنجاز رائع</p>
        <h2 id="modalTitle">أكملت المرحلة!</h2>
        <p id="modalText">أحسنت! جاهز للمرحلة التالية؟</p>
        <div class="modal-actions">
          <button id="nextStageBtn" class="primary-btn" type="button">
            المرحلة التالية ←
          </button>
          <button id="reviewBtn" class="secondary-btn" type="button">
            شوف الإجابات
          </button>
        </div>
      </div>
    </div>

    <div id="nameModal" class="modal hidden" role="dialog" aria-modal="true">
      <div class="modal-card">
        <div class="modal-symbol">ب</div>
        <p class="eyebrow">أهلًا بيك في فَطِن</p>
        <h2 id="authTitle">إنشاء حساب جديد</h2>
        <p id="authDescription">أنشئ حسابك واحفظ تقدمك على أي جهاز.</p>

        <form id="authForm">
          <input
            id="nameInput"
            class="name-input"
            type="text"
            maxlength="16"
            placeholder="اسم اللاعب"
            autocomplete="nickname"
          />

          <input
            id="emailInput"
            class="name-input"
            type="email"
            placeholder="البريد الإلكتروني"
            autocomplete="email"
            required
          />

          <input
            id="passwordInput"
                        dir="ltr"
            class="name-input"
            type="password"
            placeholder="كلمة المرور (٦ أحرف على الأقل)"
            autocomplete="new-password"
            minlength="6"
            required
          />
                    <button id="showPassBtn" class="link-btn" type="button">
            إظهار كلمة السر
          </button>
                    <button id="forgotBtn" class="link-btn" type="button" hidden>
            نسيت كلمة السر؟
          </button>

          <div id="nameError" class="name-error" role="alert"></div>

          <button id="startBtn" class="primary-btn" type="submit">
            إنشاء حساب
          </button>
        </form>

        <button id="authSwitchBtn" class="secondary-btn" type="button">
          عندك حساب؟ سجّل دخول
        </button>
      </div>
    </div>

    <div
      id="boardModal"
      class="modal hidden"
      role="dialog"
      aria-modal="true"
      aria-labelledby="boardTitle"
    >
      <div class="modal-card board-card">
        <div class="modal-symbol">🏆</div>
        <p class="eyebrow">اللوحة الشرفية</p>
        <h2 id="boardTitle">أفضل ١٠ لاعبين</h2>
        <ol id="boardList" class="board-list"></ol>
        <div class="modal-actions">
          <button id="closeBoardBtn" class="primary-btn" type="button">
            إغلاق
          </button>
          <button id="switchPlayerBtn" class="secondary-btn" type="button">
            تبديل اللاعب
          </button>
        </div>
      </div>
    </div>

    <div
      id="finishModal"
      class="modal hidden"
      role="dialog"
      aria-modal="true"
      aria-labelledby="finishTitle"
    >
      <div class="modal-card">
        <div class="modal-symbol">🏆</div>
        <p class="eyebrow">ختمت اللعبة</p>
        <h2 id="finishTitle">مبروك!</h2>
        <div class="finish-stats">
          <div>
            <strong id="finishAnswers"></strong><span>إجابة صحيحة</span>
          </div>
          <div><strong id="finishStages"></strong><span>مرحلة</span></div>
          <div><strong id="finishRank">#١</strong><span>ترتيبك</span></div>
        </div>
        <p id="finishText"></p>
        <div class="modal-actions">
          <button id="finishBoardBtn" class="primary-btn" type="button">
            شوف اللوحة الشرفية
          </button>
          <button id="replayBtn" class="secondary-btn" type="button">
            العب من جديد
          </button>
        </div>
      </div>
    </div>
        <canvas id="confettiCanvas" aria-hidden="true"></canvas>
        <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.0"></script>
    <script src="script.js?v=8"></script>
  </body>
</html>
